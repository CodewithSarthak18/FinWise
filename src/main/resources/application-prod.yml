# ==============================================================================
# FinWise Production Spring Profile Configuration (application-prod.yml)
# ==============================================================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  # Production container compression
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 2048
  forward-headers-strategy: native

spring:
  application:
    name: finwise-backend

  # Production MySQL Data Source
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:finwise_db}?useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FinWiseProdHikariCP
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      validation-timeout: 5000

  # Production JPA / Hibernate (Strict Schema Validation)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  # Flyway Database Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# FinWise Domain Security, Scheduler & CORS
finwise:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 mins
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:FinWiseApp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With,Idempotency-Key
    exposed-headers: Authorization,Link,X-Total-Count,X-RateLimit-Limit,X-RateLimit-Remaining
    allow-credentials: true
    max-age: 3600
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    recurring-cron: ${RECURRING_CRON:0 0 2 * * ?}

# Production Actuator & Health Probes (Liveness & Readiness for Docker / K8s)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.finwise: ${LOG_LEVEL_FINWISE:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
    org.flywaydb: INFO
