spring:
  application:
    name: finwise-backend-test

  datasource:
    url: jdbc:h2:mem:finwise_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

finwise:
  jwt:
    secret: 4c9e6679b42540de944be07fc1f90ae7d825a09b3c41ef58d629a8c17b5f210a
    access-token-expiration-ms: 60000
    refresh-token-expiration-ms: 3600000
    issuer: FinWiseTest
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600
