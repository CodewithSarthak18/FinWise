  <text x="295" y="410" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Savings &amp; Investments</text>
  <text x="685" y="410" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="end">63.8% (₹79,800)</text>
  <rect x="295" y="420" width="390" height="12" rx="6" fill="#f1f5f9" />
  <rect x="295" y="420" width="390" height="12" rx="6" fill="#10b981" />

  <!-- Smart Insights Card -->
  <rect x="730" y="215" width="445" height="260" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="755" y="245" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">💡 Rule-Based Smart Insights</text>
  
  <!-- Insight 1 -->
  <rect x="755" y="265" width="395" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="770" y="288" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Excellent Savings Discipline</text>
  <text x="770" y="306" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Your savings rate of 63.84% exceeds the recommended 20% benchmark.</text>

  <!-- Insight 2 -->
  <rect x="755" y="330" width="395" height="55" rx="8" fill="#fefce8" stroke="#fef08a" />
  <text x="770" y="353" fill="#854d0e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Shopping Alert</text>
  <text x="770" y="371" fill="#a16207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Shopping expenses rose by 14% compared to October. Consider a ₹5,000 cap.</text>

  <!-- Insight 3 -->
  <rect x="755" y="395" width="395" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="770" y="418" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Goal Acceleration Opportunity</text>
  <text x="770" y="436" fill="#1d4ed8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Allocating ₹15,000 of surplus can complete 'Emergency Fund' 2 months early.</text>

  <!-- Bottom Row: What-If Simulator & Subscriptions -->
  <!-- What-If Simulator Card -->
  <rect x="270" y="495" width="440" height="230" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="295" y="525" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">🔮 What-If Savings Calculator</text>
  <text x="295" y="542" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Simulate spending reductions without touching actual ledger data.</text>

  <rect x="295" y="560" width="180" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="310" y="582" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Category: Dining Out ▾</text>

  <rect x="490" y="560" width="100" height="34" rx="6" fill="#10b981" />
  <text x="540" y="582" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">Reduce 15%</text>

  <rect x="295" y="610" width="390" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="315" y="635" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Current Monthly Spend: <tspan font-weight="bold" fill="#0f172a">₹8,400.00</tspan></text>
  <text x="315" y="658" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Projected Reduced Spend: <tspan font-weight="bold" fill="#0f172a">₹7,140.00</tspan></text>
  <text x="315" y="682" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700">Estimated Annual Savings: ₹15,120.00 / year</text>

  <!-- Subscription Detector Card -->
  <rect x="730" y="495" width="445" height="230" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="755" y="525" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">🔍 Subscription Detector</text>
  <text x="755" y="542" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Pattern-matched recurring subscriptions</text>

  <!-- Sub Item 1 -->
  <line x1="755" y1="560" x2="1150" y2="560" stroke="#f1f5f9" />
  <text x="755" y="585" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Netflix Premium UHD</text>
  <text x="755" y="602" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Monthly • Last paid 28 Oct 2026</text>
  <text x="1150" y="585" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="end">₹649.00 / mo</text>
  <text x="1150" y="602" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="end">₹7,788.00 / yr</text>

  <!-- Sub Item 2 -->
  <line x1="755" y1="620" x2="1150" y2="620" stroke="#f1f5f9" />
  <text x="755" y="645" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Spotify Family Plan</text>
  <text x="755" y="662" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Monthly • Last paid 15 Oct 2026</text>
  <text x="1150" y="645" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="end">₹179.00 / mo</text>
  <text x="1150" y="662" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="end">₹2,148.00 / yr</text>
</svg>
