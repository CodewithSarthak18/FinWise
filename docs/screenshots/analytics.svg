  <!-- 50/30/20 Rule Card -->
  <rect x="270" y="215" width="440" height="260" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="295" y="245" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">50 / 30 / 20 Budget Distribution</text>
  <text x="295" y="262" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Needs (50%) • Wants (30%) • Savings (20%)</text>

  <!-- Needs Bar -->
  <text x="295" y="300" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Needs (Rent, Bills, Groceries)</text>
  <text x="685" y="300" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="end">28.5% (₹35,600)</text>
  <rect x="295" y="310" width="390" height="12" rx="6" fill="#f1f5f9" />
  <rect x="295" y="310" width="222" height="12" rx="6" fill="#3b82f6" />

  <!-- Wants Bar -->
  <text x="295" y="355" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Wants (Dining, Shopping, Movies)</text>
  <text x="685" y="355" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" text-anchor="end">7.6% (₹9,600)</text>
  <rect x="295" y="365" width="390" height="12" rx="6" fill="#f1f5f9" />
  <rect x="295" y="365" width="98" height="12" rx="6" fill="#f59e0b" />

