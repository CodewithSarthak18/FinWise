<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="sidebarGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#f8fafc" />

  <!-- Sidebar -->
  <rect width="240" height="750" fill="url(#sidebarGrad3)" />
  <circle cx="45" cy="45" r="16" fill="#10b981" />
  <text x="45" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="900" text-anchor="middle">₹</text>
  <text x="75" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="700">FinWise</text>

  <!-- Nav Items -->
  <text x="50" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">📊 Dashboard</text>
  <text x="50" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">💳 Transactions</text>
  <text x="50" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">🎯 Budgets</text>
  <text x="50" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">💰 Savings Goals</text>
  <text x="50" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">🔄 Recurring</text>
  <rect x="15" y="325" width="210" height="40" rx="8" fill="#10b981" fill-opacity="0.15" />
  <text x="50" y="350" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600">📈 Analytics</text>

  <!-- Top Header -->
  <rect x="240" y="0" width="960" height="70" fill="#ffffff" />
  <text x="270" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="700">Financial Analytics &amp; Smart Insights</text>
  <text x="270" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Data-driven behavioral insights, 50/30/20 breakdown, and subscription intelligence.</text>

  <!-- Top Metric Cards -->
  <!-- Card 1: Savings Rate -->
  <rect x="270" y="95" width="285" height="100" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="290" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Savings Rate</text>
  <text x="290" y="160" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="26" font-weight="800">63.84%</text>
  <text x="460" y="158" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Target: 50%</text>

  <!-- Card 2: Net Monthly Surplus -->
  <rect x="580" y="95" width="285" height="100" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="600" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Net Monthly Surplus</text>
  <text x="600" y="160" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="26" font-weight="800">₹79,800.00</text>
  <text x="780" y="158" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">▲ +12%</text>

  <!-- Card 3: Detected Subscriptions -->
  <rect x="890" y="95" width="285" height="100" rx="10" fill="#ffffff" filter="url(#shadow3)" stroke="#e2e8f0" />
  <text x="910" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Active Subscriptions</text>
  <text x="910" y="160" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="26" font-weight="800">5 <tspan font-size="15" fill="#64748b">Detected</tspan></text>
  <text x="1070" y="158" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">₹2,840 / mo</text>

