<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="sidebarGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#f8fafc" />

  <!-- Sidebar -->
  <rect width="240" height="750" fill="url(#sidebarGrad2)" />
  <circle cx="45" cy="45" r="16" fill="#10b981" />
  <text x="45" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="900" text-anchor="middle">₹</text>
  <text x="75" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="700">FinWise</text>

  <!-- Nav Items -->
  <text x="50" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">📊 Dashboard</text>
  <rect x="15" y="145" width="210" height="40" rx="8" fill="#10b981" fill-opacity="0.15" />
  <text x="50" y="170" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600">💳 Transactions</text>
  <text x="50" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">🎯 Budgets</text>
  <text x="50" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">💰 Savings Goals</text>
  <text x="50" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">🔄 Recurring</text>
  <text x="50" y="350" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">📈 Analytics</text>

  <!-- Top Header -->
  <rect x="240" y="0" width="960" height="70" fill="#ffffff" />
  <text x="270" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="700">Transactions &amp; Ledger</text>
  <text x="270" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Manage, filter, search, and refund double-entry transactions.</text>

  <!-- Filter Bar -->
  <rect x="270" y="90" width="905" height="60" rx="8" fill="#ffffff" filter="url(#shadow2)" stroke="#e2e8f0" />
  <!-- Search Input -->
  <rect x="285" y="102" width="220" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="300" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">🔍 Search transactions...</text>
  <!-- Category Dropdown -->
  <rect x="520" y="102" width="140" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="535" y="125" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">All Categories ▾</text>
  <!-- Type Dropdown -->
  <rect x="675" y="102" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="690" y="125" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">All Types ▾</text>
  <!-- Date Range -->
  <rect x="810" y="102" width="190" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="825" y="125" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">📅 01 Nov - 30 Nov ▾</text>
  <!-- Add Transaction Button -->
  <rect x="1015" y="102" width="145" height="36" rx="6" fill="#10b981" />
  <text x="1035" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">+ New Transaction</text>

  <!-- Transactions Table Card -->
  <rect x="270" y="170" width="905" height="540" rx="8" fill="#ffffff" filter="url(#shadow2)" stroke="#e2e8f0" />

  <!-- Table Headings -->
  <rect x="270" y="170" width="905" height="40" rx="8" fill="#f8fafc" />
  <text x="290" y="195" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">DATE</text>
  <text x="400" y="195" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">DESCRIPTION &amp; MERCHANT</text>
  <text x="660" y="195" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">CATEGORY</text>
  <text x="800" y="195" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">ACCOUNT</text>
  <text x="960" y="195" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="end">AMOUNT</text>
  <text x="1100" y="195" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">ACTIONS</text>

  <!-- Row 1 -->
  <line x1="270" y1="210" x2="1175" y2="210" stroke="#f1f5f9" />
  <text x="290" y="240" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">03 Nov 2026</text>
  <text x="400" y="240" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Reliance Digital (Smartwatch)</text>
  <rect x="660" y="226" width="80" height="20" rx="4" fill="#ede9fe" />
  <text x="700" y="240" fill="#6d28d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">Shopping</text>
  <text x="800" y="240" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">HDFC Credit Card</text>
  <text x="960" y="240" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" text-anchor="end">- ₹14,999.00</text>
  <!-- Action Buttons: Refund & Delete -->
  <rect x="1040" y="225" width="55" height="26" rx="4" fill="#fef3c7" />
  <text x="1067" y="242" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">Refund</text>
  <text x="1120" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">⋮</text>

  <!-- Row 2 -->
  <line x1="270" y1="260" x2="1175" y2="260" stroke="#f1f5f9" />
  <text x="290" y="290" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">02 Nov 2026</text>
  <text x="400" y="290" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Electricity Bill (Tata Power)</text>
  <rect x="660" y="276" width="70" height="20" rx="4" fill="#fef3c7" />
  <text x="695" y="290" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">Utilities</text>
  <text x="800" y="290" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">SBI Savings</text>
  <text x="960" y="290" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" text-anchor="end">- ₹3,240.00</text>
  <rect x="1040" y="275" width="55" height="26" rx="4" fill="#fef3c7" />
  <text x="1067" y="292" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" text-anchor="middle">Refund</text>
  <text x="1120" y="292" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">⋮</text>

  <!-- Row 3 -->
  <line x1="270" y1="310" x2="1175" y2="310" stroke="#f1f5f9" />
  <text x="290" y="340" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">01 Nov 2026</text>
  <text x="400" y="340" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Monthly Compensation</text>
  <rect x="660" y="326" width="60" height="20" rx="4" fill="#ecfdf5" />
  <text x="690" y="340" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">Salary</text>
  <text x="800" y="340" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">HDFC Salary</text>
  <text x="960" y="340" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" text-anchor="end">+ ₹1,25,000.00</text>
  <text x="1067" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Income</text>
  <text x="1120" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14">⋮</text>

  <!-- REFUND POPUP MODAL OVERLAY -->
  <rect x="240" y="0" width="960" height="750" fill="#0f172a" fill-opacity="0.45" />

  <!-- Modal Dialog -->
  <rect x="520" y="160" width="460" height="380" rx="12" fill="#ffffff" filter="url(#shadow2)" />
  <!-- Modal Header -->
  <text x="550" y="200" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="700">Refund Transaction</text>
  <text x="550" y="222" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Transaction: Reliance Digital (Smartwatch) • Max: ₹14,999.00</text>
  <line x1="520" y1="240" x2="980" y2="240" stroke="#f1f5f9" />

  <!-- Form Fields -->
  <text x="550" y="270" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Refund Amount (INR) *</text>
  <rect x="550" y="280" width="400" height="40" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" />
  <text x="565" y="305" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600">₹ 14,999.00</text>
  <text x="550" y="335" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Funds will be credited back to HDFC Credit Card account balance.</text>

  <text x="550" y="365" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Refund Reason / Notes (Optional)</text>
  <rect x="550" y="375" width="400" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="565" y="400" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Device return processed at store.</text>

  <!-- Modal Buttons -->
  <rect x="730" y="475" width="90" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="775" y="499" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="500" text-anchor="middle">Cancel</text>

  <rect x="835" y="475" width="115" height="38" rx="6" fill="#10b981" />
  <text x="892" y="499" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">Confirm Refund</text>
</svg>
